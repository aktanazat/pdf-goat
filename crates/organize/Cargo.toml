[package]
name = "pdf-organize"
description = "Page organization verbs: merge, split, extract, delete, reorder, rotate, overlay, watermark, the pages family, bookmarks, and links."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
goat-common = { workspace = true }
pdf-core = { workspace = true }
pdf-font = { workspace = true }
# Python dicts keep insertion order: every JSON object the CLI prints must too.
serde_json = { version = "1.0.151", features = ["preserve_order"] }

[dev-dependencies]
goat-fixtures = { workspace = true }
tempfile = "3.27.0"
