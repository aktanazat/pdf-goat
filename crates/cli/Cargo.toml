[package]
name = "pdf-goat"
description = "The pdf-goat command line: composes every verb family behind one argparse-compatible parser."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "pdf-goat"

[[bin]]
name = "pdf-goat"
path = "src/main.rs"

# The MCP stdio server: every tool call runs the `pdf-goat` binary built beside it.
[[bin]]
name = "pdf-goat-mcp"
path = "src/mcp/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
goat-common = { workspace = true }
pdf-inspect = { workspace = true }
pdf-organize = { workspace = true }
pdf-sign = { workspace = true }
pdf-render = { workspace = true }
pdf-forms = { workspace = true }
pdf-edit = { workspace = true }
pdf-compose = { workspace = true }
pdf-text = { workspace = true }
# Python dicts keep insertion order; every JSON object the CLI prints must too.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
signal-hook = "0.3.18"
tempfile = "3.27.0"
# pdf-goat-mcp only.
base64 = "0.23.1"
libc = "0.2.189"
rmcp = { version = "3.3.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "process", "rt", "signal", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }

[dev-dependencies]
goat-fixtures = { workspace = true }
