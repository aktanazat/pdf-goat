[package]
name = "pdf-goat"
description = "The pdf-goat command line: composes every verb family behind one argparse-compatible parser."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "pdf-goat"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
goat-common = { workspace = true }
pdf-inspect = { workspace = true }
pdf-organize = { workspace = true }
pdf-sign = { workspace = true }
pdf-render = { workspace = true }
pdf-forms = { workspace = true }
pdf-edit = { workspace = true }
pdf-compose = { workspace = true }
pdf-text = { workspace = true }
# Python dicts keep insertion order; every JSON object the CLI prints must too.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
signal-hook = "0.3.18"
tempfile = "3.27.0"
