[package]
name = "pdf-sign"
description = "Digital signatures, OCR text layers, and Office conversion for pdf-goat."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
cms = { version = "0.2.3", features = ["builder"] }
const-oid = { version = "0.9.6", features = ["db"] }
der = { version = "0.7.10", features = ["alloc", "derive", "oid", "std"] }
dsa = "0.6.3"
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std", "pkcs8"] }
ed448-goldilocks-plus = { version = "0.16.0", default-features = false, features = ["std", "signing", "pkcs8"] }
goat-common = { workspace = true }
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa", "std"] }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "std"] }
p384 = { version = "0.13.1", default-features = false, features = ["ecdsa", "std"] }
p521 = { version = "0.13.3", default-features = false, features = ["ecdsa", "std"] }
pdf-core = { workspace = true }
pdf-font = { workspace = true }
pdf-interp = { workspace = true }
pdf-ocr = { workspace = true }
pdf-raster = { workspace = true }
pdf-render = { workspace = true }
rand = "0.8.5"
rsa = { version = "0.9.10", features = ["sha2", "hazmat"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha1 = { version = "0.10.6", features = ["oid"] }
sha2 = { version = "0.10.9", features = ["oid"] }
sha3 = "0.10.8"
signature = "2.2.0"
spki = { version = "0.7.3", features = ["alloc"] }
x509-cert = { version = "0.2.5", features = ["builder", "hazmat"] }

[dev-dependencies]
goat-fixtures = { workspace = true }
tempfile = "3.27.0"
pdf-text = { workspace = true }
